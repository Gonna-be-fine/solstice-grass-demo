<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#19251d" />
    <title>Solstice — Meadow Study</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="A windswept procedural meadow beside a pond"></canvas>
      <section class="intro" aria-live="polite">
        <p class="eyebrow">A small world, grown by code</p>
        <h1>Meadow<br /><em>at the water’s edge</em></h1>
        <p class="description">A procedural grass study inspired by the quiet gardens of Solstice.</p>
      </section>
      <aside class="controls" aria-label="Scene controls">
        <label for="wind">Breeze <span id="wind-value">Gentle</span></label>
        <input id="wind" type="range" min="0" max="1.5" step="0.01" value="0.62" />
        <p>Drag to look around · Scroll to wander closer</p>
      </aside>
      <div class="loading" id="loading">Growing the meadow…</div>
      <div class="error" id="error" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
