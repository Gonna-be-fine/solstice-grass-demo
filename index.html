<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#19251d" />
    <title>Solstice — Meadow Study</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="A windswept procedural meadow beside a pond"></canvas>
      <section class="intro" aria-live="polite">
        <p class="eyebrow">A small world, grown by code</p>
        <h1>Meadow<br /><em>at the water’s edge</em></h1>
        <p class="description">A procedural grass study inspired by the quiet gardens of Solstice.</p>
      </section>
      <aside class="controls" aria-label="场景控制">
        <label for="wind">微风 <span id="wind-value">微风</span></label>
        <input id="wind" type="range" min="0" max="1.5" step="0.01" value="0.62" />
        <p>拖动查看场景 · 滚轮缩放</p>
      </aside>
      <aside class="grass-panel" aria-label="草地调节面板">
        <header class="grass-panel__header">
          <div>
            <p class="grass-panel__eyebrow">MEADOW SETTINGS</p>
            <h2>草地调节</h2>
          </div>
          <button id="grass-reset" class="grass-reset" type="button">恢复默认</button>
        </header>
        <div class="grass-control">
          <label for="grass-density">草地密度 <output id="grass-density-value">100%</output></label>
          <input id="grass-density" type="range" min="0.2" max="1" step="0.01" value="1" />
        </div>
        <div class="grass-control">
          <label for="grass-size">草叶大小 <output id="grass-size-value">100%</output></label>
          <input id="grass-size" type="range" min="0.6" max="1.8" step="0.01" value="1" />
        </div>
        <div class="grass-control">
          <label for="grass-bend">弯曲与风摆 <output id="grass-bend-value">100%</output></label>
          <input id="grass-bend" type="range" min="0" max="1.8" step="0.01" value="1" />
        </div>
        <div class="grass-control">
          <label for="ground-brightness">地皮亮度 <output id="ground-brightness-value">100%</output></label>
          <input id="ground-brightness" type="range" min="0.65" max="1.5" step="0.01" value="1" />
        </div>
        <p class="grass-panel__hint">调节会立即生效；密度低于 100% 时草叶不会重新生成。</p>
      </aside>
      <div class="loading" id="loading">Growing the meadow…</div>
      <div class="error" id="error" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
